[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiqian"
version = "1.0.0"
description = "为知笔记导出工具：本地缓存/在线 API 批量导出为 Markdown"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "html2text>=2020.1.16",
    "beautifulsoup4>=4.11.0",
    "requests>=2.28.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zhiqian = "exporter.cli:main"

[tool.setuptools.packages.find]
include = ["exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
